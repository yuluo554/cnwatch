name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.12"]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q

      - name: Console-script smoke (installed entry point)
        shell: bash
        run: |
          set +e
          cnwatch --version
          version_code=$?
          cnwatch --home ./ci-runtime selftest
          selftest_code=$?
          cnwatch --home ./ci-runtime classify
          not_ready_code=$?
          set -e
          test "$version_code" = "0"
          test "$selftest_code" = "0"
          test "$not_ready_code" = "3"

      - name: Offline replay smoke (frozen snapshots, no network)
        shell: bash
        run: |
          set -e
          cnwatch --home ./ci-runtime watchlist import \
            --file data/fixtures/watchlist-sample.csv --data-dir data
          cnwatch --home ./ci-runtime fetch \
            --data-dir data --snapshots-dir data/snapshots --today 2026-10-16 \
            > replay.out
          cat replay.out
          grep -q "baseline established" replay.out
          grep -q "result: complete" replay.out

      - name: Module-entry smoke
        shell: bash
        run: |
          set +e
          python -m cnwatch --home ./ci-runtime selftest
          module_code=$?
          python -m cnwatch --home ./ci-runtime definitely-not-a-command
          unknown_code=$?
          set -e
          test "$module_code" = "0"
          test "$unknown_code" = "2"
